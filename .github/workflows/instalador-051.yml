name: Instalador NEXUS 0.5.1 de prueba
on:
  push:
    branches: [fix/panel-ensenanza-05]
    paths:
      - 'NEXUS-Codigo-0.5.zip'
      - 'patches/**'
      - 'NEXUS-Codigo-0.5(1).zip'
permissions:
  contents: read
jobs:
  paquete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar el archivo base
        run: |
          if test ! -f NEXUS-Codigo-0.5.zip && test -f 'NEXUS-Codigo-0.5(1).zip'; then
            cp -- 'NEXUS-Codigo-0.5(1).zip' NEXUS-Codigo-0.5.zip
          fi
          if ! test -f NEXUS-Codigo-0.5.zip; then
            echo '::error::Falta NEXUS-Codigo-0.5.zip en la raíz de esta rama.'
            exit 1
          fi
      - name: Aplicar corrección y ejecutar prueba del perfil
        run: python3 patches/prepare_051.py NEXUS-Codigo-0.5.zip "$RUNNER_TEMP/NexusAI"
      - name: Preparar instalación paralela
        run: |
          cd "$RUNNER_TEMP/NexusAI"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          text = p.read_text()
          old = "applicationId 'co.nexus.lab.design'"
          assert text.count(old) == 1
          p.write_text(text.replace(old, "applicationId 'co.nexus.lab.paneltest'"))
          p = Path('app/src/main/AndroidManifest.xml')
          p.write_text(p.read_text().replace('android:label="NEXUS AI"', 'android:label="NEXUS Panel 0.5.1"', 1))
          PY
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Verificar firma del APK
        run: |
          apk="$RUNNER_TEMP/NexusAI/app/build/outputs/apk/debug/app-debug.apk"
          verifier="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$verifier" verify --verbose "$apk"
          cp "$apk" NEXUS-Panel-0.5.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Instalador-0.5.1-prueba
          path: NEXUS-Panel-0.5.1.apk
          if-no-files-found: error
