name: NEXUS 0.13 suministros
on:
  push:
    branches: [fix/panel-ensenanza-05]
    paths: ['Nexus012-Codigo*.zip']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Integrar y compilar el proyecto 0.12
        run: |
          set -eu
          src=$(find . -maxdepth 1 -name 'Nexus012-Codigo*.zip' -print | sort | head -1)
          unzip -q "$src" -d "$RUNNER_TEMP/source"
          project="$RUNNER_TEMP/source/NexusAI"
          python3 supply/integrate.py "$project"
          javac -d "$RUNNER_TEMP" supply/*.java
          java -cp "$RUNNER_TEMP" co.nexus.lab.live.SupplyCheck
          cd "$project"
          grep -q 'Explorar sin ejemplos' app/src/main/java/co/nexus/lab/live/LiveSetup.java
          grep -q 'co.nexus.video.Analysis' app/src/main/AndroidManifest.xml
          sed -i "s/applicationId 'co.nexus.lab.design'/applicationId 'co.nexus.lab.supplypreview'/; s/versionCode 15/versionCode 16/; s/0\.12\.0/0.13.0/g" app/build.gradle
          sed -i 's/android:label="NEXUS AI"/android:label="NEXUS IA Suministros"/; s/versionCode="15"/versionCode="16"/; s/0\.12\.0/0.13.0/g' app/src/main/AndroidManifest.xml
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Verificar y publicar ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk="$RUNNER_TEMP/source/NexusAI/app/build/outputs/apk/debug/app-debug.apk"
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$bt/apksigner" verify "$apk"
          "$bt/aapt" dump badging "$apk" | grep -F "package: name='co.nexus.lab.supplypreview' versionCode='16' versionName='0.13.0'"
          cp "$apk" Nexus013-Suministros.apk
          zip Nexus013-Suministros.zip Nexus013-Suministros.apk
          unzip -t Nexus013-Suministros.zip
          gh release create "suministros-$GITHUB_RUN_ID" Nexus013-Suministros.zip --target "$GITHUB_SHA" --prerelease --title "NEXUS 0.13 · Suministros" --notes "Prueba de instalación paralela basada en 0.12 con video y exploración autónoma."
