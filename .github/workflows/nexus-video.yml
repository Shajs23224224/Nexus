name: NEXUS Video
on:
  push:
    branches: [fix/panel-ensenanza-05]
    paths: [video/**, .github/workflows/nexus-video.yml]
permissions:
  contents: write
  statuses: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y firmar complemento Android
        shell: bash
        run: |
          set -eu
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          jar=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)
          mkdir -p out/classes out/dex
          cat > out/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="co.nexus.video" android:versionCode="1" android:versionName="1.0">
            <uses-sdk android:minSdkVersion="28" android:targetSdkVersion="31"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <application android:label="NEXUS Video" android:theme="@android:style/Theme.Material.Light">
              <activity android:name=".Review" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              <service android:name=".Analysis" android:exported="false"/>
            </application>
          </manifest>
          XML
          "$bt/aapt2" link -I "$jar" --manifest out/AndroidManifest.xml -o out/base.apk
          javac -source 8 -target 8 -bootclasspath "$bt/core-lambda-stubs.jar:$jar" -d out/classes video/*.java
          "$bt/d8" --min-api 28 --lib "$jar" --output out/dex $(find out/classes -name '*.class')
          (cd out/dex && zip ../base.apk classes.dex)
          "$bt/zipalign" -f 4 out/base.apk out/aligned.apk
          keytool -genkeypair -alias video -keyalg RSA -keysize 2048 -validity 3650 -keystore out/test.p12 -storepass android -keypass android -dname CN=NexusVideo
          "$bt/apksigner" sign --ks out/test.p12 --ks-pass pass:android --out NEXUS-Video.apk out/aligned.apk
          "$bt/apksigner" verify NEXUS-Video.apk
          zip Nexus-Video.zip NEXUS-Video.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Video
          path: NEXUS-Video.apk
      - name: Publicar ZIP de prueba
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "video-${GITHUB_RUN_ID}" Nexus-Video.zip --target "$GITHUB_SHA" --prerelease --title "NEXUS Video · análisis local" --notes "Complemento de prueba para Android 9 o posterior."
      - name: Enlazar resultado al commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ job.status }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$RESULT" = success ]; then url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/video-$GITHUB_RUN_ID/Nexus-Video.zip"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$RESULT" -f context="NEXUS Video APK" -f target_url="$url" >/dev/null
