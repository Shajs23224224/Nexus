name: Pruebas de búsqueda de suministros
on:
  push:
    branches: [fix/panel-ensenanza-05]
    paths: ['supply/**', '.github/workflows/supply-check.yml']
permissions:
  contents: read
  statuses: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m py_compile supply/integrate.py
          javac -d "$RUNNER_TEMP" supply/*.java
          java -cp "$RUNNER_TEMP" co.nexus.lab.live.SupplyCheck
      - if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ job.status }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$RESULT" -f context="Supply scenarios" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
